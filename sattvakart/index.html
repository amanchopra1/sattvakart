<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Sattva Kart — जैसा अन्न, वैसा मन।</title>

<meta
name="description"
content="Naturally grown grains and fresh stone-ground flour directly from our farms in Haryana. Transparent farming. Honest food. Sattva Kart."
/>

<link rel="canonical" href="https://www.sattvakart.com/" />
<link rel="icon" href="assets/favicon.ico">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f6f2ea;
color:#1a1a1a;
line-height:1.6;
overflow-x:hidden;
}

img,video{
max-width:100%;
display:block;
}

.container{
max-width:1200px;
margin:auto;
padding:0 24px;
}

header{
position:fixed;
top:0;
width:100%;
z-index:1000;
background:rgba(246,242,234,0.92);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(0,0,0,0.06);
}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 0;
}

.logo{
font-size:22px;
font-weight:700;
letter-spacing:-0.5px;
}

.logo span{
color:#8b5a2b;
}

nav a{
margin-left:28px;
text-decoration:none;
color:#444;
font-size:14px;
transition:0.3s;
}

nav a:hover{
color:#8b5a2b;
}

.hero{
height:100vh;
position:relative;
display:flex;
align-items:center;
overflow:hidden;
}

.hero video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
}

.hero-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.5);
}

.hero-content{
position:relative;
z-index:2;
max-width:760px;
color:white;
}

.badge{
display:inline-block;
padding:8px 14px;
border:1px solid rgba(255,255,255,0.25);
border-radius:999px;
font-size:12px;
margin-bottom:22px;
backdrop-filter:blur(8px);
}

.hero h1{
font-size:88px;
line-height:1;
font-weight:700;
letter-spacing:-3px;
margin-bottom:24px;
}

.hero-sub{
font-size:30px;
opacity:0.95;
margin-bottom:24px;
font-weight:400;
}

.hero p{
font-size:22px;
line-height:1.5;
max-width:620px;
opacity:0.88;
margin-bottom:36px;
}

.hero-buttons{
display:flex;
gap:16px;
flex-wrap:wrap;
}

.btn{
padding:14px 28px;
border-radius:999px;
text-decoration:none;
font-size:15px;
transition:0.3s;
display:inline-block;
}

.btn-primary{
background:white;
color:black;
}

.btn-primary:hover{
transform:translateY(-2px);
}

.btn-outline{
border:1px solid rgba(255,255,255,0.35);
color:white;
}

.btn-outline:hover{
background:rgba(255,255,255,0.08);
}

section{
padding:120px 0;
}

.center{
text-align:center;
}

.statement{
font-size:72px;
line-height:1.1;
font-weight:700;
letter-spacing:-2px;
max-width:1000px;
margin:auto;
}

.statement-dark{
background:#0f0f0f;
color:white;
}

.timeline{
display:grid;
gap:120px;
margin-top:80px;
}

.timeline-item{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
align-items:center;
}

.timeline-item:nth-child(even){
direction:rtl;
}

.timeline-item:nth-child(even) .timeline-text{
direction:ltr;
}

.timeline-text h3{
font-size:42px;
margin-bottom:16px;
letter-spacing:-1px;
}

.timeline-text p{
font-size:20px;
color:#555;
max-width:480px;
}

.timeline-image{
border-radius:24px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,0.12);
}

.timeline-image img{
height:500px;
width:100%;
object-fit:cover;
}

.comparison{
display:grid;
grid-template-columns:1fr 1fr;
gap:32px;
margin-top:60px;
}

.compare-card{
background:white;
padding:50px;
border-radius:28px;
}

.compare-card h3{
font-size:32px;
margin-bottom:26px;
letter-spacing:-1px;
}

.compare-card ul{
list-style:none;
}

.compare-card li{
margin-bottom:18px;
font-size:18px;
color:#555;
}

.highlight-card{
background:#1a1a1a;
color:white;
}

.highlight-card li{
color:rgba(255,255,255,0.82);
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:32px;
margin-top:70px;
}

.product{
background:white;
padding:42px;
border-radius:28px;
transition:0.3s;
}

.product:hover{
transform:translateY(-4px);
}

.product img{
border-radius:18px;
margin-bottom:22px;
height:280px;
object-fit:cover;
width:100%;
}

.product h3{
font-size:32px;
margin-bottom:14px;
}

.product p{
font-size:18px;
color:#666;
margin-bottom:28px;
}

.price{
font-size:18px;
margin-bottom:8px;
}

.subscriber{
font-weight:700;
color:#8b5a2b;
}

.subscription{
background:#111;
color:white;
border-radius:40px;
padding:90px;
}

.subscription h2{
font-size:62px;
line-height:1.1;
letter-spacing:-2px;
margin-bottom:26px;
}

.subscription ul{
margin-top:36px;
list-style:none;
}

.subscription li{
margin-bottom:18px;
font-size:20px;
opacity:0.88;
}

.philosophy{
max-width:900px;
margin:auto;
text-align:center;
}

.philosophy h2{
font-size:64px;
line-height:1.1;
letter-spacing:-2px;
margin-bottom:30px;
}

.philosophy p{
font-size:22px;
color:#666;
}

.dark-section{
background:#111;
color:white;
}

.dark-section h2{
font-size:72px;
letter-spacing:-2px;
line-height:1;
margin-bottom:20px;
}

.dark-section p{
font-size:22px;
opacity:0.85;
}

.mentor-image{
margin-top:50px;
border-radius:24px;
overflow:hidden;
max-width:900px;
margin-inline:auto;
}

.coming-soon{
display:flex;
flex-wrap:wrap;
gap:20px;
margin-top:40px;
justify-content:center;
}

.coming-soon div{
padding:16px 28px;
border-radius:999px;
background:white;
font-size:18px;
}

.final-cta{
height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

.final-cta video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

.final-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
}

.final-content{
position:relative;
z-index:2;
color:white;
max-width:900px;
padding:20px;
}

.final-content h2{
font-size:86px;
line-height:1;
letter-spacing:-3px;
margin-bottom:24px;
}

.final-content p{
font-size:24px;
opacity:0.9;
margin-bottom:36px;
}

footer{
padding:60px 0;
background:#f1e8db;
text-align:center;
}

footer p{
font-size:15px;
color:#666;
margin-bottom:10px;
}

footer a{
color:#8b5a2b;
text-decoration:none;
}

@media(max-width:900px){

.hero h1{
font-size:52px;
}

.hero-sub{
font-size:24px;
}

.hero p{
font-size:18px;
}

.statement{
font-size:44px;
}

.timeline-item{
grid-template-columns:1fr;
gap:30px;
}

.timeline-item:nth-child(even){
direction:ltr;
}

.timeline-text h3{
font-size:32px;
}

.timeline-image img{
height:320px;
}

.comparison{
grid-template-columns:1fr;
}

.products{
grid-template-columns:1fr;
}

.subscription{
padding:50px 30px;
}

.subscription h2{
font-size:42px;
}

.philosophy h2{
font-size:42px;
}

.dark-section h2{
font-size:46px;
}

.final-content h2{
font-size:52px;
}

nav{
display:none;
}

}

</style>
</head>

<body>

<header>

<div class="container nav">

<div class="logo">
Sattva <span>Kart</span>
</div>

<nav>
<a href="#story">Story</a>
<a href="#products">Products</a>
<a href="#subscription">Subscription</a>
<a href="#contact">Contact</a>
</nav>

</div>

</header>

<!-- HERO -->

<section class="hero">

<video autoplay muted loop playsinline>
<source src="assets/hero-wheat-field.mp4" type="video/mp4">
</video>

<div class="hero-overlay"></div>

<div class="container hero-content">

<div class="badge">
Naturally Grown Grains from Haryana
</div>

<h1>
जैसा अन्न, वैसा मन।
</h1>

<div class="hero-sub">
What we eat shapes who we become.
</div>

<p>
Naturally grown grains.
Fresh stone-ground flour.
Food rooted in honesty, soil & consciousness.
</p>

<div class="hero-buttons">

<a
class="btn btn-primary"
href="https://wa.me/918860493812"
target="_blank"
>
Subscribe Monthly
</a>

<a
class="btn btn-outline"
href="#story"
>
Watch Farm Journey
</a>

</div>

</div>

</section>

</body>
</html>
